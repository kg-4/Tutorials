<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simple E-Commerce Website</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <header class="bg-primary text-white d-flex align-items-center justify-content-center gap-3 p-3 shadow">
    <img src="https://cdn.vectorstock.com/i/500p/14/45/shopping-bag-logo-concept-vector-54931445.jpg"
         alt="Shopping Bag Logo"
         width="100"
         height="100"
         class="rounded">

    <div>
        <h1 class="display-5 fw-bold mb-1">Simple E-Commerce Website</h1>
        <p class="mb-0">Smart Shop, Easy Shop</p>
    </div>
</header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="fa-regular fa-handshake"> </i>  MyShop</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="#"><i class="fa-regular fa-house"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact Us</a>
                    </li>
                </ul>

                <a class="btn btn-outline-light" href="./cart.html">
                    <i class="fa-solid fa-cart-shopping"></i> Cart <span class="badge bg-danger" id="cartLength">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="container my-5">

        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-7">

                <div class="card border-0 shadow">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h3 class="mb-1">Add New Product</h3>
                        <p class="mb-0">Enter your product details below</p>
                    </div>

                    <div class="card-body p-4">

                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="prodName"
                                placeholder="Enter Product Name">
                            <label for="prodName">Product Name</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="prodCategory"
                                placeholder="Enter Product Category">
                            <label for="prodCategory">Product Category</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="number" class="form-control" id="prodPrice"
                                placeholder="Enter Product Price">
                            <label for="prodPrice">Product Price (₹)</label>
                        </div>

                        <div class="form-floating mb-4">
                            <input type="number" class="form-control" id="prodStock"
                                placeholder="Enter Product Stock">
                            <label for="prodStock">Available Stock</label>
                        </div>

                        <button id="btnAddEdit" class="btn btn-primary w-100 py-2 fw-bold">
                            + Add New Product
                        </button>

                    </div>
                </div>

            </div>
        </div>

        <section class="mt-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold text-dark mb-0">Our Products</h2>
               
            </div>

            <div class="row g-4" id="renderProdsList"></div>
        </section>

    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">MyShop | Simple E-Commerce Website </p>
    </footer>

    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
