
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Cart - E-Commerce Website</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>

<body class="bg-light">

    <header class="bg-primary text-white text-center py-4 shadow">
        <h1 class="display-5 fw-bold">Simple E-Commerce Website</h1>
        <p class="mb-0">Smart Shop , Easy Shop</p>
    </header>

    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="./index.html"><i class="fa-regular fa-handshake"></i>  MyShop</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="./index.html"><i class="fa-regular fa-house"></i> Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">About Us</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact Us</a>
                    </li>
                </ul>

                <a class="btn btn-danger" href="#">
                   <i class="fa-solid fa-cart-shopping"></i> Cart
                    <span class="badge bg-light text-dark" id="cartLength">0</span>
                </a>

            </div>
        </div>
    </nav>

    <div class="container my-5">

        <div class="card border-0 shadow-sm">

            <div class="card-header bg-white py-3">
                <h2 class="text-primary fw-bold mb-1">Shopping Cart</h2>
                <p class="text-secondary mb-0"> Please review your selected products</p>
            </div>

            <div class="card-body p-0">

                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle text-center mb-0">

                        <thead class="table-primary">
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col" class="text-start">Product Name</th>
                                <th scope="col">Price</th>
                                <th scope="col">Quantity</th>
                            </tr>
                        </thead>

                        <tbody id="renderCart">
                        </tbody>

                    </table>
                </div>

            </div>
        </div>

        <div class="row justify-content-end mt-4">
            <div class="col-12 col-md-6 col-lg-4">

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">

                        <h4 class="fw-bold mb-3"> Order Summary</h4>

                        <div id="cartAmt"></div>

                        <a href="./index.html"
                            class="btn btn-outline-primary w-100 mt-3">
                            Continue Shopping
                        </a>
                        
                    </div>
                    </div>
                        <div class="d-grid gap-2 col-6 mx-auto">
                                <button class="btn btn-danger" type="button" id="orderNowButton">Order Now</button>
                        </div>
                        
            </div>
        </div>

      

    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0"> MyShop | Smart Shop , Easy Shop </p>
    </footer>

    <script src="./script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>
</html>
