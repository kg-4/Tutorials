
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>String Operations</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f1f3f8;
            font-family: Arial, sans-serif;
        }

        /* Header */

        .header {
            background-color: #212529;
            color: white;
            text-align: center;
            padding: 25px 15px;
            margin-bottom: 40px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .header h1 {
            font-size: 32px;
            margin: 0;
            font-weight: 600;
        }

        .header p {
            color: #ced4da;
            margin: 8px 0 0;
            font-size: 15px;
        }

        /* Main Container */

        .main-container {
            max-width: 950px;
            margin: auto;
            padding: 0 20px;
        }

        /* Cards */

        .operation-card {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
        }

        /* Textarea */

        .form-label {
            font-weight: 500;
            color: #343a40;
            margin-bottom: 10px;
        }

        #inputPara {
            min-height: 200px;
            resize: vertical;
            font-size: 16px;
            padding: 15px;
            line-height: 1.6;
            color: #212529;
            background-color: white;
        }

        #inputPara::placeholder {
            color: #858b91;
            opacity: 1;
        }

        #inputPara:focus {
            border-color: #495057;
            box-shadow: 0 0 0 3px rgba(33, 37, 41, 0.12);
        }

        /* Result */

        .result-box {
            background-color: #f1f3f5;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 20px;
            min-height: 100px;
            margin-top: 20px;
            overflow-wrap: anywhere;
        }

        .result-heading {
            font-size: 14px;
            font-weight: 600;
            color: #6c757d;
            margin-bottom: 10px;
        }

        #result {
            color: #212529;
            font-size: 16px;
            white-space: pre-wrap;
        }

        /* Buttons */

        .operation-btn {
            width: 100%;
            min-height: 48px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            padding: 10px;
            transition: 0.2s;
        }

        .operation-btn:hover {
            background-color: #495057;
            border-color: #495057;
            transform: translateY(-2px);
        }

        /* Footer */

        .footer {
            text-align: center;
            color: #6c757d;
            font-size: 13px;
            padding: 10px 15px 25px;
        }

        
    </style>
</head>

<body>

    <!-- Header -->

    <header class="header">
        <h1>String Operations</h1>
        <p>JavaScript String Manipulation Project</p>
    </header>

    <!-- Main Content -->

    <main class="main-container">

        <!-- Paragraph Input and Result -->

        <div class="operation-card">

            <h2 class="section-title">Enter Your Paragraph</h2>

            <div class="mb-3">
                <label for="inputPara" class="form-label">
                    Enter Paragraph
                </label>

                <textarea
                    class="form-control"
                    placeholder="Type or paste your paragraph here..."
                    id="inputPara"
                    rows="6"></textarea>
            </div>

            <div class="result-box">
                <div class="result-heading">RESULT</div>
                <div id="result">Your result will appear here.</div>
            </div>

        </div>

        <!-- String Operations -->

        <div class="operation-card">

            <h2 class="section-title">Choose an Operation</h2>

            <div class="row g-3">

                <div class="col-12 col-sm-6 col-md-4">
                    <button class="btn btn-dark operation-btn"
                            onclick="countVowel()">
                        Count Vowels
                    </button>
                </div>

                <div class="col-12 col-sm-6 col-md-4">
                    <button class="btn btn-dark operation-btn"
                            onclick="countConsonents()">
                        Count Consonants
                    </button>
                </div>

                <div class="col-12 col-sm-6 col-md-4">
                    <button class="btn btn-dark operation-btn"
                            onclick="checkPalindrome()">
                        Check Palindrome
                    </button>
                </div>

                <div class="col-12 col-sm-6 col-md-4">
                    <button class="btn btn-dark operation-btn"
                            onclick="countLine()">
                        Count Lines
                    </button>
                </div>

                <div class="col-12 col-sm-6 col-md-4">
                    <button class="btn btn-dark operation-btn"
                            onclick="countSpace()">
                        Count Spaces
                    </button>
                </div>

                <div class="col-12 col-sm-6 col-md-4">
                    <button class="btn btn-dark operation-btn"
                            onclick="toUpperCase()">
                        Convert to Uppercase
                    </button>
                </div>

                <div class="col-12 col-sm-6 col-md-4">
                    <button class="btn btn-dark operation-btn"
                            onclick="toLowerCase()">
                        Convert to Lowercase
                    </button>
                </div>

                <div class="col-12 col-sm-6 col-md-4">
                    <button class="btn btn-dark operation-btn"
                            onclick="toCamelCase()">
                        Convert to Camel Case
                    </button>
                </div>

            </div>
        </div>

    </main>

    <!-- Footer -->

    <footer class="footer">
        Built using HTML, CSS, Bootstrap and JavaScript
    </footer>

    <script src="./script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
